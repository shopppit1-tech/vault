<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc">
<title>Vault — Link & File</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#18202d;--muted:#778195;--line:#e5e9f0;--blue:#4f67e8;--blue2:#687df0;--danger:#e05252;--shadow:0 8px 30px #26324d0d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#f8faff,#eef2ff)}
.authbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 20px 60px #33415514}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#5b6ff0,#7d8cf5);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}.brand b{font-size:21px}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.auth h1{font-size:25px;margin:0 0 7px}.auth p{color:var(--muted);font-size:14px;margin:0 0 22px}.form{display:grid;gap:13px}.form label{font-size:12px;font-weight:700;color:#657085}.form input,.form select{width:100%;margin-top:6px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fafbfe;color:var(--text);outline:0}.form input:focus,.form select:focus{border-color:#8493ef;box-shadow:0 0 0 3px #687df018}.primary{border:0;border-radius:12px;padding:13px;background:var(--blue);color:#fff;font-weight:800;margin-top:3px}.primary:hover{background:#435bdc}.switch{text-align:center;margin-top:17px;color:var(--muted);font-size:13px}.switch button{border:0;background:none;color:var(--blue);font-weight:800}
#app{min-height:100vh}.shell{display:flex;min-height:100vh}.side{width:78px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:30px;position:fixed;inset:0 auto 0 0}.nav{display:grid;gap:9px}.nav button,.logout{width:44px;height:44px;border:0;border-radius:13px;background:transparent;color:#8993a5;font-size:19px}.nav button.active,.nav button:hover{background:#eef1ff;color:var(--blue)}.logout{margin-top:auto;color:#a0a8b7}.content{margin-left:78px;width:calc(100% - 78px);padding:30px 32px 70px}.wrap{max-width:1160px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.hello h1{font-size:28px;margin:0;letter-spacing:-.5px}.hello p{color:var(--muted);margin:5px 0 0;font-size:13px}.account{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:12px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:15px}.action{border:1px solid var(--line);background:#fff;border-radius:18px;padding:20px;text-align:left;box-shadow:var(--shadow);color:var(--text)}.action:hover{border-color:#cdd5f8;transform:translateY(-1px)}.action .ico{width:42px;height:42px;border-radius:12px;background:#eef1ff;display:grid;place-items:center;color:var(--blue);font-size:19px;margin-bottom:13px}.action b{display:block;font-size:15px}.action small{display:block;color:var(--muted);margin-top:4px;font-size:12px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 14px}.toolbar h2{font-size:17px;margin:0}.search{width:min(360px,50%);padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;min-height:145px;box-shadow:var(--shadow)}.cardtop{display:flex;gap:11px;align-items:center}.type{width:38px;height:38px;border-radius:11px;background:#f0f3fa;display:grid;place-items:center}.card h3{font-size:14px;margin:0 0 4px;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.url{font-size:11px;color:#8992a3;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.desc{font-size:12px;color:#8992a3;margin:16px 0}.meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#98a0af}.mini{display:flex;gap:5px}.mini button{width:30px;height:30px;border:0;border-radius:9px;background:#f2f4f8;color:#657085}.mini button:hover{background:#e9edff;color:var(--blue)}.empty{grid-column:1/-1;text-align:center;border:1px dashed #d8dee8;border-radius:17px;padding:60px 20px;color:var(--muted)}.empty b{display:block;color:#394456;margin-bottom:5px}
.modal{position:fixed;inset:0;background:#18203355;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.box{width:min(450px,100%);background:#fff;border-radius:20px;padding:22px;box-shadow:0 25px 70px #17203333}.boxhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.box h2{font-size:18px;margin:0}.close{width:34px;height:34px;border:0;border-radius:9px;background:#f1f3f7;color:#667085}.notice{font-size:12px;color:var(--muted);background:#f5f7fb;border-radius:10px;padding:10px;margin-bottom:12px}
.bottom{display:none}
.toast{position:fixed;right:18px;bottom:18px;background:#202938;color:#fff;padding:12px 15px;border-radius:11px;font-size:12px;z-index:20;box-shadow:0 10px 30px #0002}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.account{max-width:180px}}
@media(max-width:600px){.side{display:none}.content{margin:0;width:100%;padding:22px 15px 82px}.top{display:block}.account{margin-top:12px;display:inline-block}.actions{gap:10px}.action{padding:16px}.grid{grid-template-columns:1fr}.toolbar{display:block}.search{width:100%;margin-top:10px}.bottom{position:fixed;display:flex;left:0;right:0;bottom:0;height:62px;background:#fff;border-top:1px solid var(--line);justify-content:space-around;align-items:center;z-index:8}.bottom button{border:0;background:none;color:#8993a5;font-size:20px}.bottom button.active{color:var(--blue)}}
</style>
</head>
<body>

<section id="auth" class="auth">
  <div class="authbox">
    <div class="brand"><div class="logo">V</div><div><b>Vault</b><span>Link & File Cloud</span></div></div>
    <h1 id="authTitle">Masuk ke Vault</h1>
    <p id="authText">Simpan link dan file di cloud. Login di HP lain dan data tetap ada.</p>
    <form id="authForm" class="form">
      <label>Email<input id="email" type="email" autocomplete="email" placeholder="nama@email.com" required></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Minimal 6 karakter" minlength="6" required></label>
      <button class="primary" id="authBtn">Masuk</button>
    </form>
    <div class="switch"><span id="switchText">Belum punya akun?</span> <button id="switchBtn" type="button">Daftar</button></div>
  </div>
</section>

<section id="app" class="hidden">
<div class="shell">
<aside class="side">
  <div class="logo">V</div>
  <div class="nav"><button class="active">⌂</button><button onclick="showFavorites()">★</button></div>
  <button class="logout" onclick="logout()">↪</button>
</aside>
<main class="content">
<div class="wrap">
  <div class="top">
    <div class="hello"><h1>Vault</h1><p>Semua link dan file tersimpan aman di cloud.</p></div>
    <div class="account" id="account"></div>
  </div>
  <div class="actions">
    <button class="action" onclick="openModal('link')"><div class="ico">🔗</div><b>Simpan Link</b><small>Tambahkan URL ke koleksi</small></button>
    <button class="action" onclick="openModal('file')"><div class="ico">📁</div><b>Simpan File</b><small>Upload file ke cloud</small></button>
  </div>
  <div class="toolbar"><h2 id="sectionTitle">Koleksi</h2><input id="search" class="search" placeholder="Cari link atau file..."></div>
  <div id="grid" class="grid"></div>
</div>
</main>
</div>
<div class="bottom"><button class="active" onclick="loadItems()">⌂</button><button onclick="showFavorites()">★</button><button onclick="logout()">↪</button></div>
</section>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
<div class="box">
  <div class="boxhead"><h2 id="modalTitle">Simpan Link</h2><button class="close" onclick="closeModal()">×</button></div>
  <div id="notice" class="notice">Data akan tersimpan ke akun Supabase kamu.</div>
  <div class="form">
    <div id="linkFields">
      <label>Nama<input id="linkName" placeholder="Contoh: Website saya"></label>
      <label>URL<input id="linkUrl" placeholder="https://..."></label>
    </div>
    <div id="fileFields" style="display:none">
      <label>Nama file<input id="fileLabel" placeholder="Boleh dikosongkan"></label>
      <label>Pilih file<input id="fileInput" type="file"></label>
    </div>
    <label>Kategori<select id="category"><option>Umum</option><option>Kerja</option><option>Pribadi</option><option>Favorit</option></select></label>
    <button class="primary" id="saveBtn" onclick="saveItem()">Simpan</button>
  </div>
</div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL="https://cnjssbqdmgfnvdtsudwx.supabase.co";
const SUPABASE_KEY="sb_publishable_Btz0DaQ6caSL30NsCNY6-g_d3p3l-LZ";
const BUCKET="vault-files";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let mode="link",items=[],favoritesOnly=false,registerMode=false;

const $=id=>document.getElementById(id);
function toast(msg){$("toast").textContent=msg;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),2600)}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

$("switchBtn").onclick=()=>{registerMode=!registerMode;$("authTitle").textContent=registerMode?"Buat akun Vault":"Masuk ke Vault";$("authBtn").textContent=registerMode?"Daftar":"Masuk";$("switchText").textContent=registerMode?"Sudah punya akun?":"Belum punya akun?";$("switchBtn").textContent=registerMode?"Masuk":"Daftar";$("password").autocomplete=registerMode?"new-password":"current-password"}
$("authForm").onsubmit=async e=>{
 e.preventDefault();$("authBtn").disabled=true;$("authBtn").textContent=registerMode?"Mendaftar...":"Masuk...";
 const email=$("email").value.trim(),password=$("password").value;
 let result=registerMode?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});
 $("authBtn").disabled=false;$("authBtn").textContent=registerMode?"Daftar":"Masuk";
 if(result.error){toast(result.error.message);return}
 if(registerMode&&!result.data.session){toast("Akun dibuat. Cek email untuk verifikasi, lalu masuk.");return}
 $("auth").classList.add("hidden");$("app").classList.remove("hidden");initUser();
}
async function initUser(){let {data:{user}}=await db.auth.getUser();if(!user)return;$("account").textContent=user.email;await loadItems()}
async function logout(){await db.auth.signOut();items=[];$("app").classList.add("hidden");$("auth").classList.remove("hidden")}
function openModal(m){mode=m;$("modal").classList.add("show");$("modalTitle").textContent=m==="link"?"Simpan Link":"Simpan File";$("linkFields").style.display=m==="link"?"block":"none";$("fileFields").style.display=m==="file"?"block":"none";$("linkName").value="";$("linkUrl").value="";$("fileLabel").value="";$("fileInput").value=""}
function closeModal(){$("modal").classList.remove("show")}
async function saveItem(){
 $("saveBtn").disabled=true;$("saveBtn").textContent="Menyimpan...";
 try{
  const {data:{user}}=await db.auth.getUser();if(!user)throw Error("Sesi login sudah habis.");
  if(mode==="link"){
   let name=$("linkName").value.trim(),url=$("linkUrl").value.trim();if(!name||!url)throw Error("Isi nama dan URL.");if(!/^https?:\/\//i.test(url))url="https://"+url;
   const {error}=await db.from("items").insert({user_id:user.id,type:"link",name,value:url,category:$("category").value});
   if(error)throw error;
  }else{
   const file=$("fileInput").files[0];if(!file)throw Error("Pilih file.");
   if(file.size>50*1024*1024)throw Error("Maksimal file 50 MB.");
   const safe=file.name.replace(/[^\w.\-() ]/g,"_");const path=user.id+"/"+crypto.randomUUID()+"-"+safe;
   let up=await db.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type||"application/octet-stream"});
   if(up.error)throw up.error;
   const {error}=await db.from("items").insert({user_id:user.id,type:"file",name:$("fileLabel").value.trim()||file.name,value:file.name,storage_path:path,mime_type:file.type,size:file.size,category:$("category").value});
   if(error){await db.storage.from(BUCKET).remove([path]);throw error}
  }
  closeModal();toast("Berhasil disimpan.");await loadItems();
 }catch(e){toast(e.message||"Gagal menyimpan")}
 $("saveBtn").disabled=false;$("saveBtn").textContent="Simpan";
}
async function loadItems(){
 favoritesOnly=false;$("sectionTitle").textContent="Koleksi";
 const {data,error}=await db.from("items").select("*").order("created_at",{ascending:false});if(error){toast(error.message);return}items=data||[];render()
}
async function showFavorites(){favoritesOnly=true;$("sectionTitle").textContent="Favorit";const {data,error}=await db.from("items").select("*").eq("favorite",true).order("created_at",{ascending:false});if(error){toast(error.message);return}items=data||[];render()}
function render(){
 const q=$("search").value.toLowerCase();const list=items.filter(x=>(x.name+" "+x.value+" "+x.category).toLowerCase().includes(q));
 if(!list.length){$("grid").innerHTML='<div class="empty"><b>Belum ada koleksi</b>Simpan link atau upload file untuk mulai.</div>';return}
 $("grid").innerHTML=list.map(x=>`<article class="card">
 <div class="cardtop"><div class="type">${x.type==="file"?"📄":"🔗"}</div><div><h3>${escapeHtml(x.name)}</h3><div class="url">${escapeHtml(x.value)}</div></div></div>
 <div class="desc">${escapeHtml(x.category||"Umum")} · ${new Date(x.created_at).toLocaleDateString("id-ID")}</div>
 <div class="meta"><span>${x.type==="file"?(formatSize(x.size)):"Link"}</span><div class="mini">
 <button onclick="toggleFav('${x.id}',${!!x.favorite})">${x.favorite?"★":"☆"}</button>
 ${x.type==="file"?`<button onclick="downloadFile('${x.id}')">↓</button>`:`<button onclick="window.open('${escapeHtml(x.value)}','_blank')">↗</button>`}
 <button onclick="deleteItem('${x.id}','${x.type}','${escapeHtml(x.storage_path||"")}')">×</button></div></div></article>`).join("")
}
function formatSize(n){if(!n)return"File";let u=["B","KB","MB","GB"],i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+" "+u[i]}
$("search").oninput=render;
async function toggleFav(id,current){const {error}=await db.from("items").update({favorite:!current}).eq("id",id);if(error)toast(error.message);else favoritesOnly?showFavorites():loadItems()}
async function deleteItem(id,type,path){
 if(!confirm("Hapus item ini?"))return;
 const {error}=await db.from("items").delete().eq("id",id);if(error){toast(error.message);return}
 if(type==="file"&&path)await db.storage.from(BUCKET).remove([path]);
 toast("Item dihapus.");favoritesOnly?showFavorites():loadItems()
}
async function downloadFile(id){
 const x=items.find(v=>v.id===id);if(!x||!x.storage_path)return;
 const {data,error}=await db.storage.from(BUCKET).createSignedUrl(x.storage_path,120);if(error){toast(error.message);return}
 const a=document.createElement("a");a.href=data.signedUrl;a.download=x.value;a.target="_blank";document.body.appendChild(a);a.click();a.remove()
}
db.auth.onAuthStateChange((event,session)=>{if(session){$("auth").classList.add("hidden");$("app").classList.remove("hidden");initUser()}else{$("auth").classList.remove("hidden");$("app").classList.add("hidden")}});
</script>
</body>
</html>
