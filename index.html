<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>Vault — Link & File</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f5f7fb;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex}.side{width:76px;border-right:1px solid #20242d;background:#0b0d12;display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#7c5cff,#20d6a3);display:grid;place-items:center;font-weight:900}.nav{margin-top:28px;display:grid;gap:10px}.nav button{width:44px;height:44px;border:0;border-radius:13px;background:transparent;color:#858c9b;font-size:20px}.nav button.active,.nav button:hover{background:#181c25;color:#fff}.main{width:min(1180px,100%);margin:auto;padding:34px 28px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.title h1{margin:0;font-size:30px;letter-spacing:-1px}.title p{margin:6px 0 0;color:#7f8796;font-size:14px}.search{width:min(390px,45vw);position:relative}.search input{width:100%;padding:13px 16px 13px 42px;background:#11141b;border:1px solid #242a35;border-radius:14px;color:#fff;outline:none}.search span{position:absolute;left:15px;top:11px;color:#727a89}.actions{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}.action{padding:22px;border:1px solid #242a35;background:linear-gradient(145deg,#11151d,#0d1016);border-radius:20px;text-align:left;color:#fff}.action:hover{border-color:#5145d9;transform:translateY(-2px)}.action .ico{width:43px;height:43px;border-radius:13px;background:#191d28;display:grid;place-items:center;font-size:20px;margin-bottom:14px}.action b{display:block;font-size:16px}.action small{display:block;color:#737b8a;margin-top:5px}.bar{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px}.bar h2{font-size:17px;margin:0}.bar span{font-size:12px;color:#707888}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#10131a;border:1px solid #202631;border-radius:17px;padding:17px;min-height:145px;position:relative}.card:hover{border-color:#343b49}.cardtop{display:flex;gap:11px;align-items:center}.type{width:38px;height:38px;border-radius:11px;background:#191d27;display:grid;place-items:center}.card h3{font-size:14px;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}.card .url{font-size:11px;color:#70798a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.desc{font-size:12px;color:#8a92a1;margin:15px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;justify-content:space-between;align-items:center;color:#697180;font-size:11px}.actions2{display:flex;gap:5px}.actions2 button{border:0;background:#191d25;color:#9aa2b0;border-radius:8px;width:30px;height:30px}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;border:1px dashed #2a303b;border-radius:18px;color:#697180}.empty strong{display:block;color:#d7dbe3;margin-bottom:7px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.show{display:flex}.box{width:min(460px,100%);background:#10131a;border:1px solid #2a303b;border-radius:22px;padding:23px;box-shadow:0 25px 80px #0008}.boxhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.box h2{font-size:19px;margin:0}.close{border:0;background:#1a1e27;color:#aaa;border-radius:9px;width:34px;height:34px}.form{display:grid;gap:13px}.form label{font-size:12px;color:#929aaa}.form input,.form select{width:100%;margin-top:6px;background:#0b0e14;border:1px solid #292f3a;border-radius:12px;padding:12px;color:#fff;outline:none}.save{margin-top:4px;border:0;border-radius:12px;padding:13px;background:linear-gradient(135deg,#705cff,#20cfa0);color:#fff;font-weight:800}.bottom{display:none}
@media(max-width:800px){.side{display:none}.main{padding:24px 16px 90px}.top{display:block}.search{width:100%;margin-top:18px}.actions{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.title h1{font-size:25px}.actions{gap:10px}.action{padding:16px}.grid{grid-template-columns:1fr}.bottom{position:fixed;display:flex;bottom:0;left:0;right:0;height:62px;background:#0b0d12ee;border-top:1px solid #20242d;justify-content:space-around;align-items:center;z-index:4}.bottom button{background:none;border:0;color:#777f8e;font-size:20px}.bottom button.active{color:#fff}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="logo">V</div>
<div class="nav"><button class="active">⌂</button><button>★</button><button>▣</button></div>
</aside>
<main class="main">
<div class="top">
<div class="title"><h1>Vault</h1><p>Simpan link dan file dengan simpel.</p></div>
<div class="search"><span>⌕</span><input id="search" placeholder="Cari..."></div>
</div>
<div class="actions">
<button class="action" onclick="openModal('link')"><div class="ico">🔗</div><b>Simpan Link</b><small>Tambahkan URL ke Vault</small></button>
<button class="action" onclick="openModal('file')"><div class="ico">📁</div><b>Simpan File</b><small>Simpan file di perangkat ini</small></button>
</div>
<div class="bar"><h2>Koleksi</h2><span id="count">0 item</span></div>
<div id="grid" class="grid"></div>
</main>
</div>
<div class="bottom"><button class="active">⌂</button><button>★</button><button>▣</button></div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
<div class="box">
<div class="boxhead"><h2 id="modalTitle">Simpan Link</h2><button class="close" onclick="closeModal()">×</button></div>
<div class="form">
<div id="linkFields">
<label>Nama<input id="name" placeholder="Contoh: Website saya"></label>
<label>URL<input id="url" placeholder="https://..."></label>
</div>
<div id="fileFields" style="display:none">
<label>Nama<input id="fileName" placeholder="Nama file"></label>
<label>Pilih file<input id="file" type="file"></label>
</div>
<label>Kategori<select id="cat"><option>Umum</option><option>Kerja</option><option>Pribadi</option><option>Favorit</option></select></label>
<button class="save" onclick="saveItem()">Simpan</button>
</div>
</div>
</div>

<script>
const KEY="vault_items_v1";let items=JSON.parse(localStorage.getItem(KEY)||"[]");let mode="link";
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(items))}
function openModal(m){mode=m;$("modal").classList.add("show");$("linkFields").style.display=m==="link"?"block":"none";$("fileFields").style.display=m==="file"?"block":"none";$("modalTitle").textContent=m==="link"?"Simpan Link":"Simpan File";$("name").value="";$("url").value="";$("fileName").value="";$("file").value=""}
function closeModal(){$("modal").classList.remove("show")}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function render(){
 const q=$("search").value.toLowerCase();const list=items.filter(x=>(x.name+" "+x.value+" "+x.cat).toLowerCase().includes(q));
 $("count").textContent=list.length+" item"+(list.length!==1?"":"");
 if(!list.length){$("grid").innerHTML='<div class="empty"><strong>Belum ada koleksi</strong>Klik Simpan Link atau Simpan File untuk mulai.</div>';return}
 $("grid").innerHTML=list.map(x=>`<article class="card"><div class="cardtop"><div class="type">${x.type==="file"?"📄":"🔗"}</div><div><h3>${esc(x.name)}</h3><div class="url">${esc(x.type==="file"?x.value:x.value)}</div></div></div><div class="desc">${esc(x.cat)} · ${new Date(x.date).toLocaleDateString("id-ID")}</div><div class="meta"><span>${x.type==="file"?"File tersimpan":"Link tersimpan"}</span><div class="actions2"><button onclick="fav('${x.id}')">${x.fav?"★":"☆"}</button>${x.type==="file"?`<button onclick="downloadFile('${x.id}')">↓</button>`:`<button onclick="window.open('${esc(x.value)}','_blank')">↗</button>`}<button onclick="del('${x.id}')">×</button></div></div></article>`).join("")
}
async function saveItem(){
 if(mode==="link"){let name=$("name").value.trim(),url=$("url").value.trim();if(!name||!url)return alert("Isi nama dan URL.");if(!/^https?:\/\//i.test(url))url="https://"+url;items.unshift({id:crypto.randomUUID(),type:"link",name,value:url,cat:$("cat").value,date:Date.now(),fav:false})}
 else {let f=$("file").files[0],name=$("fileName").value.trim()||f?.name;if(!f)return alert("Pilih file.");if(!name)return alert("Isi nama file.");let data=await readFile(f);items.unshift({id:crypto.randomUUID(),type:"file",name,value:f.name,data, mime:f.type,cat:$("cat").value,date:Date.now(),fav:false})}
 save();render();closeModal()
}
function readFile(f){return new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function fav(id){let x=items.find(x=>x.id===id);x.fav=!x.fav;save();render()}
function del(id){if(confirm("Hapus item ini?")){items=items.filter(x=>x.id!==id);save();render()}}
function downloadFile(id){let x=items.find(x=>x.id===id);let a=document.createElement("a");a.href=x.data;a.download=x.value;a.click()}
$("search").addEventListener("input",render);render();
</script>
</body>
</html>
