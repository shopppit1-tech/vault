<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>Vault — Cloud Storage</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--surface2:#f8faff;--text:#172033;--muted:#7d8799;--line:#e6eaf1;--blue:#5369e8;--blue2:#7a8cf2;--red:#e35b64;--green:#35ad82;--shadow:0 10px 35px rgba(31,48,80,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#e9edff,transparent 35%),var(--bg)}.authbox{width:min(420px,100%);padding:32px;background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:0 25px 70px #29385d12}.brand{display:flex;align-items:center;gap:12px;margin-bottom:27px}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;display:grid;place-items:center;font-weight:900;font-size:20px}.brand b{font-size:21px}.brand small{display:block;color:var(--muted);margin-top:2px}.auth h1{margin:0 0 6px;font-size:25px}.auth p{margin:0 0 22px;color:var(--muted);font-size:13px}.form{display:grid;gap:13px}.form label{font-size:12px;font-weight:700;color:#657086}.form input,.form select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:13px;background:#fbfcff;color:var(--text);outline:none}.primary{border:0;border-radius:12px;padding:13px;background:var(--blue);color:#fff;font-weight:800}.switch{text-align:center;margin-top:17px;font-size:13px;color:var(--muted)}.switch button{border:0;background:none;color:var(--blue);font-weight:800}
.shell{min-height:100vh;display:flex}.side{position:fixed;inset:0 auto 0 0;width:78px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:18px 0;z-index:5}.nav{margin-top:30px;display:grid;gap:9px}.nav button,.logout{width:44px;height:44px;border:0;border-radius:13px;background:transparent;color:#8b95a6;font-size:19px}.nav button.active,.nav button:hover{background:#eef1ff;color:var(--blue)}.logout{margin-top:auto}.content{margin-left:78px;width:calc(100% - 78px);padding:30px 32px 70px}.wrap{max-width:1160px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px}.hello h1{font-size:29px;margin:0}.hello p{font-size:13px;color:var(--muted);margin:5px 0 0}.account{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:12px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:25px 0}.action{border:1px solid var(--line);background:#fff;border-radius:19px;padding:20px;text-align:left;color:var(--text);box-shadow:var(--shadow);transition:.18s}.action:hover{transform:translateY(-2px);border-color:#ccd5fb}.ico{width:42px;height:42px;border-radius:12px;background:#eef1ff;display:grid;place-items:center;color:var(--blue);font-size:19px;margin-bottom:12px}.action b{display:block;font-size:15px}.action small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:26px 0 12px}.toolbar h2{margin:0;font-size:18px}.search{width:min(360px,50%);border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;outline:none}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.filter{border:1px solid var(--line);background:#fff;color:#788397;border-radius:20px;padding:8px 13px;font-size:12px;white-space:nowrap}.filter.active{background:#eef1ff;color:var(--blue);border-color:#dce2ff;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-height:158px;transition:.18s}.card:hover{border-color:#d4daf0;transform:translateY(-1px)}.cardtop{display:flex;gap:11px;align-items:center}.type{width:40px;height:40px;border-radius:12px;background:#f0f3f9;display:grid;place-items:center}.card h3{font-size:14px;margin:0 0 4px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.url{font-size:11px;color:#8a94a5;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.group{display:inline-flex;margin-top:12px;padding:5px 8px;border-radius:8px;background:#f4f6fa;color:#727d91;font-size:10px}.desc{font-size:11px;color:#9aa2af;margin:12px 0}.meta{display:flex;justify-content:space-between;align-items:center;color:#9aa2af;font-size:11px}.mini{display:flex;gap:5px}.mini button{width:30px;height:30px;border:0;border-radius:9px;background:#f1f3f7;color:#687388}.mini button:hover{background:#eef1ff;color:var(--blue)}.mini .danger:hover{background:#fff0f1;color:var(--red)}.empty{grid-column:1/-1;text-align:center;border:1px dashed #d6dce7;border-radius:18px;padding:60px 20px;color:var(--muted)}.empty b{display:block;color:#374258;margin-bottom:5px}
.modal{position:fixed;inset:0;background:#1d263955;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.box{width:min(460px,100%);background:#fff;border-radius:22px;padding:22px;box-shadow:0 30px 80px #1c274033}.boxhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.box h2{font-size:18px;margin:0}.close{border:0;background:#f1f3f7;color:#687388;border-radius:9px;width:34px;height:34px}.notice{background:#f5f7fb;color:#778196;padding:10px;border-radius:10px;font-size:12px;margin-bottom:12px}.confirm-icon{width:48px;height:48px;border-radius:15px;background:#fff0f1;color:var(--red);display:grid;place-items:center;font-size:23px;margin-bottom:14px}.confirm p{color:var(--muted);font-size:13px;line-height:1.5}.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.secondary{border:1px solid var(--line);background:#f7f8fb;color:#657085;border-radius:11px;padding:12px;font-weight:700}.dangerbtn{border:0;background:var(--red);color:#fff;border-radius:11px;padding:12px;font-weight:800}.downloadbtn{background:var(--blue)}.toast{position:fixed;right:18px;bottom:18px;background:#202938;color:#fff;padding:12px 15px;border-radius:11px;font-size:12px;z-index:30;box-shadow:0 10px 30px #0002}.bottom{display:none}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.side{display:none}.content{margin:0;width:100%;padding:22px 15px 82px}.top{display:block}.account{display:inline-block;margin-top:12px}.actions{gap:10px}.action{padding:16px}.grid{grid-template-columns:1fr}.toolbar{display:block}.search{width:100%;margin-top:10px}.bottom{position:fixed;display:flex;left:0;right:0;bottom:0;height:62px;background:#fff;border-top:1px solid var(--line);justify-content:space-around;align-items:center;z-index:8}.bottom button{border:0;background:none;color:#8993a5;font-size:20px}.bottom button.active{color:var(--blue)}}
</style>

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vault">


<style id="pwa-install-style">
#pwaInstallBtn{display:none;position:fixed;right:16px;bottom:82px;z-index:1000;border:0;border-radius:999px;padding:12px 16px;background:#111827;color:#fff;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.16);cursor:pointer}
#pwaInstallBtn.show{display:block}
@media(min-width:700px){#pwaInstallBtn{bottom:24px}}
</style>

</head>
<body>

<section id="auth" class="auth">
<div class="authbox">
<div class="brand"><div class="logo">V</div><div><b>Vault</b><small>Link & File Cloud</small></div></div>
<h1 id="authTitle">Masuk ke Vault</h1><p id="authText">Simpan link dan file di cloud. Akses dari perangkat lain dengan akun yang sama.</p>
<form id="authForm" class="form">
<label>Email<input id="email" type="email" placeholder="nama@email.com" required></label>
<label>Password<input id="password" type="password" placeholder="Minimal 6 karakter" minlength="6" required></label>
<button class="primary" id="authBtn">Masuk</button>
</form>
<div class="switch"><span id="switchText">Belum punya akun?</span> <button id="switchBtn" type="button">Daftar</button></div>
</div></section>

<section id="app" class="hidden">
<div class="shell">
<aside class="side"><div class="logo">V</div><div class="nav"><button class="active" onclick="loadItems()">⌂</button><button onclick="showFavorites()">★</button></div><button class="logout" onclick="logout()">↪</button></aside>
<main class="content"><div class="wrap">
<div class="top"><div class="hello"><h1>Vault</h1><p>Rapi, ringan, dan tersimpan di cloud.</p></div><div id="account" class="account"></div></div>
<div class="actions">
<button class="action" onclick="openModal('link')"><div class="ico">🔗</div><b>Simpan Link</b><small>Tambahkan URL ke kelompok tertentu</small></button>
<button class="action" onclick="openModal('file')"><div class="ico">📁</div><b>Simpan File</b><small>Upload dan kelompokkan file</small></button>
</div>
<div class="toolbar"><h2 id="sectionTitle">Koleksi</h2><input id="search" class="search" placeholder="Cari..."></div>
<div id="filters" class="filters"></div>
<div id="grid" class="grid" style="margin-top:14px"></div>
</div></main></div>
<div class="bottom"><button class="active" onclick="loadItems()">⌂</button><button onclick="showFavorites()">★</button><button onclick="logout()">↪</button></div>
</section>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="box">
<div class="boxhead"><h2 id="modalTitle">Simpan Link</h2><button class="close" onclick="closeModal()">×</button></div>
<div class="notice">Pilih kelompok supaya koleksi lebih rapi.</div>
<div class="form">
<div id="linkFields"><label>Nama<input id="linkName" placeholder="Contoh: Website saya"></label><label>URL<input id="linkUrl" placeholder="https://..."></label></div>
<div id="fileFields" style="display:none"><label>Nama file<input id="fileLabel" placeholder="Boleh dikosongkan"></label><label>Pilih file<input id="fileInput" type="file"></label></div>
<label>Kelompok<select id="category"><option>Umum</option><option>Kerja</option><option>Pribadi</option><option>Dokumen</option><option>Foto</option><option>Video</option><option>Aplikasi</option><option>Favorit</option></select></label>
<button class="primary" id="saveBtn" onclick="saveItem()">Simpan</button>
</div></div></div>

<div id="confirmModal" class="modal"><div class="box confirm">
<div class="confirm-icon" id="confirmIcon">!</div><h2 id="confirmTitle">Konfirmasi</h2><p id="confirmText"></p>
<div class="confirm-actions"><button class="secondary" onclick="closeConfirm()">Batal</button><button id="confirmBtn" class="dangerbtn">Lanjutkan</button></div>
</div></div>
<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL="https://cnjssbqdmgfnvdtsudwx.supabase.co";
const SUPABASE_KEY="sb_publishable_Btz0DaQ6caSL30NsCNY6-g_d3p3l-LZ";
const BUCKET="vault-files";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let mode="link",items=[],favoritesOnly=false,currentType="all",currentGroup="all",confirmAction=null,registerMode=false;
const $=id=>document.getElementById(id);
function toast(m){$("toast").textContent=m;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),2500)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function formatSize(n){if(!n)return"File";let u=["B","KB","MB","GB"],i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+" "+u[i]}
function openModal(m){mode=m;$("modal").classList.add("show");$("modalTitle").textContent=m==="link"?"Simpan Link":"Simpan File";$("linkFields").style.display=m==="link"?"block":"none";$("fileFields").style.display=m==="file"?"block":"none";$("linkName").value="";$("linkUrl").value="";$("fileLabel").value="";$("fileInput").value=""}
function closeModal(){$("modal").classList.remove("show")}
function ask(title,text,kind,fn){$("confirmTitle").textContent=title;$("confirmText").textContent=text;$("confirmIcon").textContent=kind==="download"?"↓":"!";$("confirmBtn").textContent=kind==="download"?"Unduh":"Hapus";$("confirmBtn").className=kind==="download"?"dangerbtn downloadbtn":"dangerbtn";confirmAction=fn;$("confirmModal").classList.add("show")}
function closeConfirm(){confirmAction=null;$("confirmModal").classList.remove("show")}
$("confirmBtn").onclick=async()=>{let f=confirmAction;closeConfirm();if(f)await f()}
$("switchBtn").onclick=()=>{registerMode=!registerMode;$("authTitle").textContent=registerMode?"Buat akun Vault":"Masuk ke Vault";$("authBtn").textContent=registerMode?"Daftar":"Masuk";$("switchText").textContent=registerMode?"Sudah punya akun?":"Belum punya akun?";$("switchBtn").textContent=registerMode?"Masuk":"Daftar"}
$("authForm").onsubmit=async e=>{e.preventDefault();$("authBtn").disabled=true;let email=$("email").value.trim(),password=$("password").value;let r=registerMode?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});$("authBtn").disabled=false;if(r.error){toast(r.error.message);return}if(registerMode&&!r.data.session){toast("Akun dibuat. Cek email verifikasi.");return}enterApp()}
async function enterApp(){let {data:{user}}=await db.auth.getUser();if(!user)return;$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("account").textContent=user.email;loadItems()}
async function logout(){await db.auth.signOut()}
function buildFilters(){let groups=[...new Set(items.map(x=>x.category||"Umum"))].sort();$("filters").innerHTML=`<button class="filter ${currentType==="all"?"active":""}" onclick="setType('all')">Semua</button><button class="filter ${currentType==="link"?"active":""}" onclick="setType('link')">🔗 Link</button><button class="filter ${currentType==="file"?"active":""}" onclick="setType('file')">📁 File</button>`+groups.map(g=>`<button class="filter ${currentGroup===g?"active":""}" onclick="setGroup('${esc(g)}')">${esc(g)}</button>`).join("")}
function setType(t){currentType=t;currentGroup="all";favoritesOnly=false;$("sectionTitle").textContent="Koleksi";buildFilters();render()}
function setGroup(g){currentGroup=g;favoritesOnly=false;$("sectionTitle").textContent="Kelompok: "+g;buildFilters();render()}
async function loadItems(){favoritesOnly=false;currentType="all";currentGroup="all";$("sectionTitle").textContent="Koleksi";let r=await db.from("items").select("*").order("created_at",{ascending:false});if(r.error){toast(r.error.message);return}items=r.data||[];buildFilters();render()}
async function showFavorites(){favoritesOnly=true;currentType="all";currentGroup="all";$("sectionTitle").textContent="Favorit";let r=await db.from("items").select("*").eq("favorite",true).order("created_at",{ascending:false});if(r.error){toast(r.error.message);return}items=r.data||[];buildFilters();render()}
function render(){let q=$("search").value.toLowerCase();let list=items.filter(x=>(currentType==="all"||x.type===currentType)&&(currentGroup==="all"||(x.category||"Umum")===currentGroup)&&(x.name+" "+x.value+" "+(x.category||"")).toLowerCase().includes(q));if(!list.length){$("grid").innerHTML='<div class="empty"><b>Tidak ada koleksi</b>Belum ada item pada kelompok ini.</div>';return}$("grid").innerHTML=list.map(x=>`<article class="card"><div class="cardtop"><div class="type">${x.type==="file"?"📄":"🔗"}</div><div><h3>${esc(x.name)}</h3><div class="url">${esc(x.value)}</div></div></div><span class="group">${esc(x.category||"Umum")}</span><div class="desc">${x.type==="file"?formatSize(x.size):"Link tersimpan"} · ${new Date(x.created_at).toLocaleDateString("id-ID")}</div><div class="meta"><span>${x.favorite?"Favorit":"Tersimpan"}</span><div class="mini"><button onclick="toggleFav('${x.id}',${!!x.favorite})">${x.favorite?"★":"☆"}</button>${x.type==="file"?`<button onclick="requestDownload('${x.id}')">↓</button>`:`<button onclick="window.open('${esc(x.value)}','_blank')">↗</button>`}<button class="danger" onclick="requestDelete('${x.id}','${x.type}','${esc(x.storage_path||"")}')">×</button></div></div></article>`).join("")}
$("search").oninput=render;
async function saveItem(){$("saveBtn").disabled=true;try{let {data:{user}}=await db.auth.getUser();if(!user)throw Error("Sesi login habis.");if(mode==="link"){let name=$("linkName").value.trim(),url=$("linkUrl").value.trim();if(!name||!url)throw Error("Isi nama dan URL.");if(!/^https?:\/\//i.test(url))url="https://"+url;let r=await db.from("items").insert({user_id:user.id,type:"link",name,value:url,category:$("category").value});if(r.error)throw r.error}else{let f=$("fileInput").files[0];if(!f)throw Error("Pilih file.");if(f.size>50*1024*1024)throw Error("Maksimal file 50 MB.");let safe=f.name.replace(/[^\w.\-() ]/g,"_"),path=user.id+"/"+crypto.randomUUID()+"-"+safe;let up=await db.storage.from(BUCKET).upload(path,f,{contentType:f.type||"application/octet-stream"});if(up.error)throw up.error;let r=await db.from("items").insert({user_id:user.id,type:"file",name:$("fileLabel").value.trim()||f.name,value:f.name,storage_path:path,mime_type:f.type,size:f.size,category:$("category").value});if(r.error){await db.storage.from(BUCKET).remove([path]);throw r.error}}closeModal();toast("Berhasil disimpan");await loadItems()}catch(e){toast(e.message||"Gagal menyimpan")}$("saveBtn").disabled=false}
async function toggleFav(id,current){let r=await db.from("items").update({favorite:!current}).eq("id",id);if(r.error)toast(r.error.message);else favoritesOnly?showFavorites():loadItems()}
function requestDelete(id,type,path){ask("Hapus item?","Item ini akan dihapus dari koleksi kamu. "+(type==="file"?"File di cloud juga akan dihapus.":"Tindakan ini tidak bisa dibatalkan."),"delete",()=>deleteItem(id,type,path))}
async function deleteItem(id,type,path){let r=await db.from("items").delete().eq("id",id);if(r.error){toast(r.error.message);return}if(type==="file"&&path)await db.storage.from(BUCKET).remove([path]);toast("Item berhasil dihapus");favoritesOnly?showFavorites():loadItems()}
function requestDownload(id){ask("Unduh file?","File akan diunduh ke perangkat kamu. Lanjutkan?","download",()=>downloadFile(id))}
async function downloadFile(id){let x=items.find(v=>v.id===id);if(!x)return;let r=await db.storage.from(BUCKET).createSignedUrl(x.storage_path,120);if(r.error){toast(r.error.message);return}let a=document.createElement("a");a.href=r.data.signedUrl;a.download=x.value;a.target="_blank";document.body.appendChild(a);a.click();a.remove();toast("Download dimulai")}
db.auth.onAuthStateChange((e,s)=>{if(s)enterApp();else{$("auth").classList.remove("hidden");$("app").classList.add("hidden")}})
</script>
<button id="pwaInstallBtn" type="button">📲 Install Vault</button>

<script id="pwa-install-script">
(() => {
  let deferredPrompt = null;
  const btn = document.getElementById('pwaInstallBtn');
  if (!btn) return;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    btn.classList.add('show');
  });

  btn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch (_) {}
    deferredPrompt = null;
    btn.classList.remove('show');
  });

  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    btn.classList.remove('show');
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    });
  }
})();
</script>

</body>
</html>
